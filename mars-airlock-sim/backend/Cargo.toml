[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.7", features = ["ws", "json"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
futures-util = "0.3.31"
anyhow = "1.0.100"
async-opcua = { version = "0.18.0", features = ["server"] }
zenoh = "1.0"
log = "0.4.28"
env_logger = "0.11.8"
rumqttc = "0.24"
