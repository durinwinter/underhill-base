services:
  mars-airlock:
    container_name: mars-airlock-sim
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      AIRLOCK_SECURITY_PROFILE: "${AIRLOCK_SECURITY_PROFILE:-NONE}"
      AIRLOCK_OPCUA_BIND_HOST: "${AIRLOCK_OPCUA_BIND_HOST:-0.0.0.0}"
      AIRLOCK_OPCUA_HOST: "${AIRLOCK_OPCUA_HOST:-}"
      AIRLOCK_OPCUA_PORT: "${AIRLOCK_OPCUA_PORT:-4841}"
      AIRLOCK_OPCUA_ENDPOINT_PATH: "${AIRLOCK_OPCUA_ENDPOINT_PATH:-/underhill/airlock}"
      AIRLOCK_OPCUA_ENDPOINT_URL: "${AIRLOCK_OPCUA_ENDPOINT_URL:-opc.tcp://127.0.0.1:4841/underhill/airlock}"
      ECLSS_OPCUA_PORT: "${ECLSS_OPCUA_PORT:-4842}"
      SABATIER_OPCUA_PORT: "${SABATIER_OPCUA_PORT:-4843}"
      POWERGRID_OPCUA_PORT: "${POWERGRID_OPCUA_PORT:-4844}"
      THERMAL_OPCUA_PORT: "${THERMAL_OPCUA_PORT:-4845}"
      WATER_OPCUA_PORT: "${WATER_OPCUA_PORT:-4846}"
      MURPH_NODE_ID: "${MURPH_NODE_ID:-local}"
      ZENOH_ROUTER: "${ZENOH_ROUTER:-}"
      UNS_MQTT_BROKER: "${UNS_MQTT_BROKER:-}"
      UNS_MQTT_CLIENT_ID: "${UNS_MQTT_CLIENT_ID:-underhill-uns-publisher}"
      UNS_MQTT_USERNAME: "${UNS_MQTT_USERNAME:-}"
      UNS_MQTT_PASSWORD: "${UNS_MQTT_PASSWORD:-}"
      UNDERHILL_TIME_SCALE: "${UNDERHILL_TIME_SCALE:-1.0}"
      UNDERHILL_WALL_TICK_MS: "${UNDERHILL_WALL_TICK_MS:-50}"
      UNDERHILL_MEDIUM_PERIOD_SEC: "${UNDERHILL_MEDIUM_PERIOD_SEC:-1.0}"
      UNDERHILL_SLOW_PERIOD_SEC: "${UNDERHILL_SLOW_PERIOD_SEC:-60.0}"
      UNDERHILL_MAX_STEPS_PER_WALL_TICK: "${UNDERHILL_MAX_STEPS_PER_WALL_TICK:-2000}"
      UNDERHILL_PLANT_ID: "${UNDERHILL_PLANT_ID:-underhill-base-primary}"
      UNDERHILL_STATE_DIR: "${UNDERHILL_STATE_DIR:-/app/backend/data/continuous}"
      UNDERHILL_CHECKPOINT_INTERVAL_SEC: "${UNDERHILL_CHECKPOINT_INTERVAL_SEC:-60}"
      UNDERHILL_DOWNTIME_POLICY: "${UNDERHILL_DOWNTIME_POLICY:-catch_up}"
      UNDERHILL_MAX_DOWNTIME_CATCHUP_SEC: "${UNDERHILL_MAX_DOWNTIME_CATCHUP_SEC:-604800}"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - "./pki:/app/backend/pki"
      - "./backend/data:/app/backend/data"
      - "./frontend:/app/frontend"
    restart: unless-stopped
